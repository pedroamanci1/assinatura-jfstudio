<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assinaturas ativas — JF Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --gold: #c9a227;
        --gold-light: #e8d48a;
        --gold-dark: #8b6914;
        --paper: #ffffff;
        --ink: #0a0a0a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Sans 3", system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        background-image: linear-gradient(
            180deg,
            rgba(201, 162, 39, 0.06) 0%,
            transparent 28%
          ),
          var(--paper);
      }

      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
      }

      header {
        text-align: center;
        margin-bottom: 2.25rem;
        padding-bottom: 1.5rem;
        border-bottom: 3px solid var(--gold);
      }

      h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 600;
        font-size: clamp(1.75rem, 4vw, 2.35rem);
        letter-spacing: 0.02em;
        margin: 0 0 0.35rem;
        color: var(--ink);
      }

      .subtitle {
        margin: 0;
        font-size: 0.95rem;
        color: var(--ink);
        opacity: 0.78;
      }

      .subtitle a {
        color: var(--gold-dark);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.25rem;
      }

      .count {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--ink);
      }

      button {
        font-family: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        border: 2px solid var(--gold);
        background: linear-gradient(180deg, var(--gold-light), var(--gold));
        color: var(--ink);
        padding: 0.55rem 1.15rem;
        border-radius: 6px;
        box-shadow: 0 2px 0 var(--gold-dark);
      }

      button:hover {
        filter: brightness(1.03);
      }

      button:active {
        transform: translateY(1px);
        box-shadow: 0 1px 0 var(--gold-dark);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .state {
        padding: 1rem 1.1rem;
        border-radius: 8px;
        border: 1px solid rgba(201, 162, 39, 0.55);
        background: rgba(255, 255, 255, 0.95);
        color: var(--ink);
        margin-bottom: 1rem;
      }

      .state.error {
        border-color: #b00020;
        background: #fff8f8;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      li.subscription-row {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        justify-content: space-between;
        gap: 0.85rem;
        padding: 1rem 1.1rem;
        margin-bottom: 0.65rem;
        border: 1px solid rgba(201, 162, 39, 0.45);
        border-left: 5px solid var(--gold);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 1px 0 rgba(139, 105, 20, 0.12);
      }

      .subscription-body {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 0.35rem;
      }

      .ticket-link {
        flex-shrink: 0;
        align-self: center;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.75rem;
        height: 2.75rem;
        color: var(--ink);
        border: 2px solid var(--gold);
        border-radius: 10px;
        background: linear-gradient(180deg, var(--gold-light), var(--gold));
        box-shadow: 0 2px 0 var(--gold-dark);
        text-decoration: none;
        transition: filter 0.15s, transform 0.12s;
      }

      .ticket-link:hover {
        filter: brightness(1.04);
        transform: scale(1.04);
      }

      .ticket-link:active {
        transform: translateY(1px) scale(1.02);
        box-shadow: 0 1px 0 var(--gold-dark);
      }

      .ticket-link svg {
        display: block;
        width: 1.45rem;
        height: 1.45rem;
      }

      .client {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--ink);
      }

      .products {
        font-size: 0.95rem;
        color: var(--ink);
        opacity: 0.88;
      }

      .products strong {
        font-weight: 600;
        color: var(--ink);
        opacity: 1;
      }

      .start-date {
        font-size: 0.95rem;
        color: var(--ink);
        opacity: 0.88;
      }

      .start-date strong {
        font-weight: 600;
        opacity: 1;
      }

      .tickets-info {
        font-size: 0.95rem;
        color: var(--ink);
        opacity: 0.9;
      }

      .tickets-info strong {
        font-weight: 600;
        opacity: 1;
      }

      .status-tag {
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--gold-dark);
        margin-top: 0.15rem;
      }

      footer {
        margin-top: 2rem;
        text-align: center;
        font-size: 0.8rem;
        color: var(--ink);
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Assinaturas ativas</h1>
        <p class="subtitle">
          Dados via API Stripe (equivalente ao filtro
          <a
            href="https://dashboard.stripe.com/acct_1OQaprEeeYhQbzas/subscriptions?status=active"
            target="_blank"
            rel="noopener noreferrer"
            >assinaturas ativas no painel</a
          >).
        </p>
      </header>

      <div class="toolbar">
        <span class="count" id="count"></span>
        <button type="button" id="reload">Atualizar lista</button>
      </div>

      <div id="message" class="state" hidden></div>
      <ul id="list" aria-live="polite"></ul>

      <footer>Branco, dourado e texto em preto — JF Studio</footer>
    </div>

    <script>
      const listEl = document.getElementById("list");
      const msgEl = document.getElementById("message");
      const countEl = document.getElementById("count");
      const btn = document.getElementById("reload");

      function formatInicioAssinatura(unixSeconds) {
        if (unixSeconds == null || !Number.isFinite(Number(unixSeconds))) return "—";
        const d = new Date(Number(unixSeconds) * 1000);
        return d.toLocaleDateString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        });
      }

      const STATUS_PT = {
        active: "Estado: ativa",
        trialing: "Estado: período experimental",
        past_due: "Estado: pagamento em atraso",
        paused: "Estado: pausada",
        unpaid: "Estado: não paga",
        canceled: "Estado: cancelada",
        incomplete: "Estado: incompleta",
        incomplete_expired: "Estado: incompleta (expirada)",
      };

      function setMessage(text, isError) {
        if (!text) {
          msgEl.hidden = true;
          msgEl.textContent = "";
          msgEl.classList.remove("error");
          return;
        }
        msgEl.hidden = false;
        msgEl.textContent = text;
        msgEl.classList.toggle("error", !!isError);
      }

      function render(items, meta) {
        listEl.innerHTML = "";
        const n = items.length;
        const mode = meta && meta.keyMode === "live" ? "live" : "teste";
        countEl.textContent =
          n === 0
            ? `Nenhum resultado (modo ${mode} da chave).`
            : `${n} assinatura(s) listada(s) (modo ${mode} da chave).`;

        if (n === 0 && meta) {
          setMessage(
            `A API devolveu 0 assinaturas com os estados: ${(meta.statusesQueried || []).join(", ")}. ` +
              `Se no painel Stripe as vê em modo ${mode === "live" ? "live" : "teste"}, confirme que a STRIPE_SECRET_KEY no .env é do mesmo modo. ` +
              `Para listar só Stripe status «active», no .env use: STRIPE_SUBSCRIPTION_STATUSES=active`,
            false
          );
        }

        const ticketSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M9 9h.01"/><path d="M15 9h.01"/><path d="M9 15h.01"/><path d="M15 15h.01"/></svg>`;

        for (const row of items) {
          const li = document.createElement("li");
          li.className = "subscription-row";

          const body = document.createElement("div");
          body.className = "subscription-body";

          const client = document.createElement("div");
          client.className = "client";
          client.textContent = row.customerName;

          const prod = document.createElement("div");
          prod.className = "products";
          prod.innerHTML =
            "<strong>Produto(s):</strong> " +
            (row.products && row.products.length
              ? row.products.join(" · ")
              : "—");

          const startEl = document.createElement("div");
          startEl.className = "start-date";
          startEl.innerHTML =
            "<strong>Início da assinatura:</strong> " +
            formatInicioAssinatura(row.subscriptionStart);

          const ticketsEl = document.createElement("div");
          ticketsEl.className = "tickets-info";
          const ano = meta && meta.ticketsYear ? meta.ticketsYear : new Date().getFullYear();
          const ticketsHtml =
            "<strong>Contador de tickets (" +
            ano +
            "):</strong> " +
            (row.countdown != null ? row.countdown : "—");
          ticketsEl.innerHTML = ticketsHtml;

          body.append(client, prod, startEl, ticketsEl);
          if (row.status) {
            const st = document.createElement("div");
            st.className = "status-tag";
            st.textContent = STATUS_PT[row.status] || `Estado: ${row.status}`;
            body.appendChild(st);
          }

          const ticket = document.createElement("a");
          ticket.className = "ticket-link";
          ticket.href = `/ticket.html?subscription=${encodeURIComponent(row.id)}&cliente=${encodeURIComponent(row.customerName)}`;
          ticket.title = "Tickets e contador";
          ticket.setAttribute("aria-label", "Abrir página de tickets e contador");
          ticket.innerHTML = ticketSvg;

          li.append(body, ticket);
          listEl.appendChild(li);
        }
      }

      async function load() {
        setMessage("");
        btn.disabled = true;
        try {
          const res = await fetch("/api/subscriptions");
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(body.error || res.statusText || "Erro ao carregar");
          }
          const meta = body.meta || null;
          if ((body.subscriptions || []).length > 0) {
            setMessage("");
          }
          render(body.subscriptions || [], meta);
        } catch (e) {
          setMessage(e.message || String(e), true);
          render([], null);
        } finally {
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", load);
      load();
    </script>
  </body>
</html>
